<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Árvore de Natal com Círculos</title>
<style>
  body {
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .tree {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .row {
    display: flex;
    justify-content: center;
  }

  .circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: green;
    margin: 3px;
  }

  .trunk {
    width: 30px;
    height: 50px;
    background: brown;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="tree">
  <div class="row">
    <div class="circle"></div>
  </div>
  <div class="row">
    <div class="circle"></div>
    <div class="circle"></div>
  </div>
  <div class="row">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>
  <div class="row">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>
  <div class="row">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>

  <div class="trunk"></div>
</div>

</body>
</html>
