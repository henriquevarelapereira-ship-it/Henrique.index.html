<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Jogo: Adivinha o Número</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
      background: #f4f4f4;
    }

    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
    }

    button {
      background: #333;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }

    #mensagem {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Adivinha o Número 🎯</h1>

  <p>Tenta adivinhar um número entre 1 e 100</p>

  <input type="number" id="palpite" placeholder="O teu palpite">
  <button onclick="verificar()">Tentar</button>
  <button onclick="reiniciar()">Reiniciar</button>

  <p id="mensagem"></p>

  <script>
    let numeroSecreto = Math.floor(Math.random() * 100) + 1;
    let tentativas = 0;

    function verificar() {
      let input = document.getElementById("palpite").value;
      let palpite = Number(input);
      let mensagem = document.getElementById("mensagem");

      if (input === "" || isNaN(palpite)) {
        mensagem.innerText = "Insere um número válido!";
        return;
      }

      tentativas++;

      if (palpite === numeroSecreto) {
        mensagem.innerText = "🎉 Acertaste em " + tentativas + " tentativas!";
      } else if (palpite < numeroSecreto) {
        mensagem.innerText = "🔼 O número é maior!";
      } else {
        mensagem.innerText = "🔽 O número é menor!";
      }
    }

    function reiniciar() {
      numeroSecreto = Math.floor(Math.random() * 100) + 1;
      tentativas = 0;
      document.getElementById("mensagem").innerText = "";
      document.getElementById("palpite").value = "";
    }
  </script>

</body>
</html>
